<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rectangles</title>
    <style>
        .outside {
            border: 3px dotted blue;
            border-radius: 20px;
            padding: 25px;
        }
        .middle {
            border: 2px dashed red;
            border-radius: 15px;
            padding: 25px;
        }
        .inner {
            border: 2px solid green;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="outside">
        <div class="middle">
            <div class="inner">
                I am heavily packed<br>
                &lt;DIV&gt;
            </div>
        </div>
    </div>

</body>
</html>
